/* =========================

========================= */

.logo{
  display:flex;
  align-items:center;
}

.logo img{
  width:105px;
  height:auto;

}

.nav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:32px;
  font-size:13px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.nav a{
  position:relative;
  padding:8px 0;
  color:#302c27;
}

.nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:0;
  height:1px;
  background:#b38a4c;
  transition:.3s ease;
}

.nav a:hover::after{
  width:100%;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:18px;
}

.header-icon{
  border:0;
  background:none;
  cursor:pointer;
  font-size:20px;
  color:#253f34;
  position:relative;
}

.bag-count{
  position:absolute;
  top:-8px;
  right:-10px;
  min-width:17px;
  height:17px;
  border-radius:50%;
  background:#1e4336;
  color:#fff;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   PAGE
========================= */

.page{
  max-width:1250px;
  margin:auto;
  padding:55px 28px 90px;
}

/* =========================
   BREADCRUMB
========================= */

.breadcrumb{
  font-size:12px;
  color:#80776c;
  letter-spacing:.7px;

}

.breadcrumb a{
  color:#6d655c;
}

.breadcrumb span{
  margin:0 8px;
}

/* =========================
   PRODUCT
========================= */

.product-layout{
  display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(350px,.92fr);
  gap:70px;
  align-items:start;
}

/* =========================
   GALLERY
========================= */

.gallery{
  min-width:0;
}

.main-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#eee7dc;
  overflow:hidden;
  border-radius:3px;
}

.main-image{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  transition:opacity .25s ease;
}

.gallery-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:42px;
  height:42px;
  border:1px solid rgba(31,63,51,.15);
  background:rgba(255,255,255,.85);
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#244337;
  font-size:20px;
  z-index:2;
}

.gallery-arrow:hover{
  background:#fff;
}

.gallery-prev{
  left:15px;
}

.gallery-next{
  right:15px;
}

.thumbnails{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:14px;
}

.thumbnail{
  aspect-ratio:1/1;
  overflow:hidden;
  background:#eee7dc;
  border:1px solid transparent;
  cursor:pointer;
}

.thumbnail.active{
  border-color:#b38a4c;
}

.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* =========================
   PRODUCT INFO
========================= */

.product-info{
  padding-top:8px;
}

.product-category{
  color:#9b7743;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2.2px;
  margin-bottom:13px;
}

.product-name{
  font-family:Georgia, "Times New Roman", serif;
  font-size:42px;
  line-height:1.12;
  font-weight:400;
  color:#263d33;
  margin-bottom:14px;
}

.product-price{
  font-size:22px;
  color:#29241f;
  margin-bottom:23px;
}

.product-code{
  font-size:11px;
  color:#898075;
  letter-spacing:1px;
  margin-bottom:28px;
}

.product-description{
  color:#655e55;
  font-size:15px;
  line-height:1.8;
  border-top:1px solid rgba(31,67,54,.13);
  padding-top:25px;
  margin-bottom:28px;
}

/* =========================
   DETAILS
========================= */

.details{

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:15px 0;
  border-bottom:1px solid rgba(31,67,54,.08);
  font-size:13px;
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-label{
  color:#877e73;
  text-transform:uppercase;
  letter-spacing:1px;
  font-size:10px;
}

.detail-value{
  color:#3b352f;
  text-align:right;
}

/* =========================
   ACTIONS
========================= */

  gap:12px;
  margin-bottom:12px;

  height:52px;

  align-items:center;
  justify-content:space-between;
  background:#fffdf9;
}

.quantity-box button{

  height:100%;

  background:none;
  cursor:pointer;

  font-size:18px;
}

.quantity-box span{

.add-bag{

  color:#fff;

  text-transform:uppercase;

.add-bag:hover{

  letter-spacing:1.2px;

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translate(-50%,120px);
  background:#1e4336;
  color:#fff;
  padding:14px 24px;
  font-size:12px;
  letter-spacing:.5px;
  z-index:100;
  opacity:0;
  transition:.3s ease;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================

    gap:30px;
  }

  .footer-brand{
    grid-column:auto;

    this.src = `./${code}-${suffix}.png`;

  };

}


/* =========================================================
   URL
========================================================= */

const params = new URLSearchParams(window.location.search);

const productCode = params.get("product");


/* =========================================================
   FIND PRODUCT
========================================================= */

const product = products.find(
  item => item.code.toUpperCase() === String(productCode || "").toUpperCase()
);


/* =========================================================
   DISPLAY PRODUCT
========================================================= */

        <p>

        </p>

        <a href="shop.html" class="back-shop">
          Back to Shop
        </a>

      </div>
    `;

    return;

  }


  document.title = `${product.name} | ALANKRA`;


  container.innerHTML = `

    <div class="breadcrumb">

      <a href="index.html">Home</a>

      <span>›</span>

      <a href="shop.html">Shop</a>

      <span>›</span>

      ${product.name}

    </div>


    <section class="product-layout">


      <!-- GALLERY -->

      <div class="gallery">

        <div class="main-image-wrap">

          <button
            class="gallery-arrow gallery-prev"
            onclick="previousImage()"

            ‹
          </button>


          <img

            alt="${product.name}"
          >

            >

          </button>


          <button

            id="thumb-3"

            <img

            >

          </button>

        </div>

      </div>


      <!-- PRODUCT INFORMATION -->

      <div class="product-info">

        <div class="product-category">
          ${product.category}
        </div>


        <h1 class="product-name">
          ${product.name}
        </h1>


        <div class="product-price">
          ₹${product.price}
        </div>


        <div class="product-code">
          PRODUCT CODE · ${product.code}
        </div>


        <div class="product-description">
          ${product.description}
        </div>


        <div class="details">

          <div class="detail-row">

            <span class="detail-label">
              Material
            </span>

            <span class="detail-value">
              ${product.material}
            </span>

          </div>


          <div class="detail-row">

            <span class="detail-label">
              Finish
            </span>

            <span class="detail-value">
              ${product.finish}
            </span>

          </div>


          <div class="detail-row">

            <span class="detail-label">
              Anti-Tarnish
            </span>

            <span class="detail-value">
              ${product.antiTarnish}
            </span>

          </div>


          <div class="detail-row">

            <span class="detail-label">
              Water-Resistant
            </span>

            <span class="detail-value">

        </div>


        <div class="quantity-row">

/* =========================================================
   IMAGE GALLERY
========================================================= */

let currentImage = 1;


function setupImages(){

  for(let i = 1; i <= 3; i++){

    const mainImage =
      document.getElementById("mainProductImage");

    const thumb =
      document.querySelector(`#thumb-${i} img`);

    if(mainImage){
      imageFallback(
        mainImage,
        product.code,
        "01"
      );
    }

    if(thumb){

      imageFallback(
        thumb,
        product.code,
        String(i).padStart(2,"0")
      );

    }

  }

}


function changeImage(number){

  currentImage = number;

  const main =
    document.getElementById("mainProductImage");

  if(!main) return;


  main.style.opacity = "0";


  setTimeout(()=>{

    main.onerror = function(){

      this.onerror = function(){

        this.src = "./placeholder.jpg";

      };

      this.src =
        `./${product.code}-${String(number).padStart(2,"0")}.png`;

    };


    main.src =
      `./${product.code}-${String(number).padStart(2,"0")}.jpg`;


    main.style.opacity = "1";

  },120);


  document.querySelectorAll(".thumbnail")
    .forEach(item => item.classList.remove("active"));


  const active =
    document.getElementById(`thumb-${number}`);

  if(active){
    active.classList.add("active");
  }

}


function nextImage(){

  currentImage++;

  if(currentImage > 3){
    currentImage = 1;
  }

  changeImage(currentImage);

}


function previousImage(){

  currentImage--;

  if(currentImage < 1){
    currentImage = 3;
  }

  changeImage(currentImage);

}


/* =========================================================
   QUANTITY
========================================================= */

let quantity = 1;


function changeQuantity(change){

  quantity += change;

  if(quantity < 1){
    quantity = 1;
  }

  if(quantity > 10){
    quantity = 10;
  }

  document.getElementById("quantity").textContent = quantity;

}


/* =========================================================
   BAG
========================================================= */

function getBag(){

  try{

    return JSON.parse(
      localStorage.getItem("alankraCart") || "[]"
    );

  }catch(error){

    return [];

  }

}


function saveBag(bag){

  localStorage.setItem(
    "alankraCart",
    JSON.stringify(bag)
  );

}


function addToBag(){

  let bag = getBag();

  const existing =
    bag.find(item => item.code === product.code);


  if(existing){

    existing.quantity += quantity;

  }else{

    bag.push({

      code:product.code,
      name:product.name,
      price:product.price,
      quantity:quantity

    });

  }


  saveBag(bag);

  updateBagCount();

  showToast(
    `${product.name} added to your bag`
  );

}


function updateBagCount(){

  const bag = getBag();

  const count =
    bag.reduce(
      (total,item) =>
        total + Number(item.quantity || 0),
      0
    );


  const badge =
    document.getElementById("bagCount");


  if(badge){

    badge.textContent = count;

  }

}


function goToBag(){

  const bag = getBag();

  if(bag.length){

    showToast("Your bag is ready");

  }else{

    showToast("Your bag is currently empty");

  }

}


/* =========================================================
   WISHLIST
========================================================= */

function getWishlist(){

  try{

    return JSON.parse(
      localStorage.getItem("alankraWishlist") || "[]"
    );

  }catch(error){

    return [];

  }

}


function saveWishlist(list){

  localStorage.setItem(
    "alankraWishlist",
    JSON.stringify(list)
  );

}


function toggleWishlist(){

  let list = getWishlist();

  const index =
    list.indexOf(product.code);


  if(index === -1){

    list.push(product.code);

    showToast(
      `${product.name} added to wishlist`
    );

  }else{

    list.splice(index,1);

    showToast(
      `${product.name} removed from wishlist`
    );

  }


  saveWishlist(list);

  updateWishlistButton();

}


function updateWishlistButton(){

  const button =
    document.getElementById("wishlistButton");

  if(!button) return;


  const list = getWishlist();

  const active =
    list.includes(product.code);


  if(active){

    button.classList.add("active");

    button.innerHTML =
      "♥ Added to Wishlist";

  }else{

    button.classList.remove("active");

    button.innerHTML =
      "♡ Add to Wishlist";

  }

}


/* =========================================================
   RELATED PRODUCTS
========================================================= */

function renderRelatedProducts(){

  const container =
    document.getElementById("relatedProducts");

  if(!container) return;


  let related =
    products.filter(
      item =>
        item.category === product.category &&
        item.code !== product.code
    );


  if(related.length < 4){

    const additional =
      products.filter(
        item =>
          item.code !== product.code &&
          !related.some(
            r => r.code === item.code
          )
      );


    related = related.concat(additional);

  }


  related =
    related.slice(0,4);


  container.innerHTML =
    related.map(item => `

      <a
        class="related-card"
        href="product.html?product=${item.code}">

        <div class="related-image">

          <img
            src="./${item.code}-01.jpg"
            alt="${item.name}"
            onerror="
              this.onerror=function(){
                this.src='./placeholder.jpg';
              };
              this.src='./${item.code}-01.png';
            "
          >

        </div>


        <div class="related-info">

          <div class="related-category">
            ${item.category}
          </div>

          <div class="related-name">
            ${item.name}
          </div>

          <div class="related-price">
            ₹${item.price}
          </div>

        </div>

      </a>

    `).join("");

}


/* =========================================================
   WHATSAPP ORDER
========================================================= */

function orderOnWhatsApp(){

  const phone =
    "919311690960";


  const total =
    product.price * quantity;


  const message =
`Hello ALANKRA ✨

I would like to order:

Product: ${product.name}
Product Code: ${product.code}
Quantity: ${quantity}
Price: ₹${product.price}
Total: ₹${total}

Please share the next steps for placing my order.`;



  const url =
    `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;


  window.open(
    url,
    "_blank"
  );

}


/* =========================================================
   SHOP
========================================================= */

function goToShop(){

  window.location.href =
    "shop.html";

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message){

  const toast =
    document.getElementById("toast");


  toast.textContent = message;

  toast.classList.add("show");


  clearTimeout(toastTimer);


  toastTimer =
    setTimeout(()=>{

      toast.classList.remove("show");

    },2500);

}


/* =========================================================
   KEYBOARD GALLERY CONTROLS
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(!product) return;


    if(event.key === "ArrowRight"){

      nextImage();

    }


    if(event.key === "ArrowLeft"){

      previousImage();

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

displayProduct();

</script>
